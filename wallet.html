<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJ Tournament - Wallet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #080a10;
    color: white;
    padding: 20px;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 10px 0 30px;
}

.back {
    background: #202431;
    border: none;
    color: white;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 18px;
}

.header h2 {
    font-size: 21px;
}

.balance-card {
    background: linear-gradient(135deg, #a90020, #41000e);
    border: 1px solid #ff3457;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 8px 30px #8b001b33;
}

.balance-card p {
    color: #ffd4dc;
    font-size: 14px;
}

.balance {
    font-size: 36px;
    font-weight: bold;
    margin: 15px 0;
}

.note {
    color: #ffbdca;
    font-size: 12px;
}

.actions {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
}

.actions button {
    flex: 1;
    padding: 15px 5px;
    border: 1px solid #333b4d;
    border-radius: 12px;
    background: #171c28;
    color: white;
    font-size: 14px;
}

.section-title {
    margin-bottom: 15px;
    font-size: 18px;
}

.transaction {
    background: #151a25;
    padding: 18px;
    border-radius: 12px;
    color: #aeb5c4;
    text-align: center;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="header">
    <button class="back" onclick="history.back()">‹</button>
    <h2>My Wallet</h2>
</div>

<div class="balance-card">
    <p>AVAILABLE DEMO POINTS</p>
    <div class="balance" id="balance">₹0</div>
    <div class="note">Demo balance only — no real money involved.</div>
</div>

<div class="actions">
    <button onclick="showMessage()">＋ Add Points</button>
    <button onclick="showMessage()">↗ Redeem</button>
</div>

<h3 class="section-title">Transaction History</h3>

<div class="transaction">
    No transactions yet.
</div>

<script>
function showMessage() {
    alert("This is a demo wallet. Real-money transactions are not enabled.");
}
</script>

</body>
</html>
